{% include base_path %}
{% assign author = site.author %}
<div itemscope itemtype="http://schema.org/Person">
  <div class="author__avatar">
    <img src="{{ author.avatar | prepend: '/images/' | prepend: base_path }}" class="author__avatar" alt="{{ author.name }}">
  </div>
  <div class="author__content"><h3 class="author__name">{{ author.name }}</h3></div>
  <div class="author__urls-wrapper">
    <button class="btn btn--inverse">Follow</button>
    <ul class="author__urls social-icons">
      <li class="author__desktop"><i class="fa-solid fa-location-dot icon-pad-right" aria-hidden="true"></i>{{ author.location }}</li>
      <li><a href="mailto:{{ author.email }}"><i class="fas fa-fw fa-envelope icon-pad-right" aria-hidden="true"></i>{{ site.data.ui-text[site.locale].email_label }}</a></li>
    </ul>
  </div>
</div>
