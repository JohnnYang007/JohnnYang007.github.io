{% include base_path %}
{% assign seo_title = page.title | default: site.title %}
<title>{{ seo_title | escape }}{% if page.title %} {{ site.title_separator }} {{ site.title | escape }}{% endif %}</title>
<meta name="description" content="{{ site.description | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | prepend: base_path }}">
<meta property="og:locale" content="{{ site.locale }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ seo_title | escape }}">
<meta property="og:description" content="{{ site.description | escape }}">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | prepend: base_path }}">
<meta property="og:type" content="website">
