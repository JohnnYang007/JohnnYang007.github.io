<p><a href="{{ '/simulations/pam.html' | relative_url }}" target="_blank" rel="noopener">Open the simulation in a separate page</a></p>
<iframe id="pam-research-viewer"
        src="{{ '/simulations/pam.html' | relative_url }}"
        title="Interactive parabolic Anderson model on the Sierpiński gasket"
        loading="lazy"
        style="display:block;width:100%;height:960px;border:0;"></iframe>
<script>
(() => {
  const frame = document.getElementById('pam-research-viewer');
  let observer;
  const watchHeight = () => {
    const body = frame.contentDocument && frame.contentDocument.body;
    if (!body) return;
    if (observer) observer.disconnect();
    const resize = () => {
      const height = Math.ceil(body.scrollHeight);
      if (height > 0 && Math.abs(frame.clientHeight - height) > 2) {
        frame.style.height = height + 'px';
      }
    };
    observer = new ResizeObserver(resize);
    observer.observe(body);
    resize();
  };
  frame.addEventListener('load', watchHeight);
})();
</script>
