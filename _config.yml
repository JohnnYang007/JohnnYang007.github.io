locale: "en-US"
title: "Johnny's Homepage"
title_separator: "-"
name: "Johnny (Yifan) Yang"
description: "Johnny (Yifan) Yang: probability, stochastic analysis, and stochastic PDEs."
url: "https://johnnyang007.github.io"
baseurl: ""
repository: "JohnnYang007/JohnnYang007.github.io"

author:
  avatar: "self.jpeg"
  name: "Johnny Yang"
  location: "Tempe, AZ"
  email: "jyang436@asu.edu"

include:
  - _pages
exclude:
  - .github
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - assets/js/_main.js
  - assets/js/plugins
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - local
  - tmp
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
future: false
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

timezone: "Etc/UTC"
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
