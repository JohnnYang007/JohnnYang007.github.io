    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;

      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {

  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;

  .form-select {

  }

    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {

    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {

  }

  .form-check-input {

  }

  .form-check-input::after {

    left: 50%;

    height: 44px;

  }

  .form-check-label {

    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;
  margin: 0 !important;

}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script type=&quot;application/json&quot; id=&quot;sg-copy&quot;&gt;{&quot;title&quot;: &quot;Parabolic Anderson Model on Sierpinski Gasket&quot;, &quot;page_description&quot;: &quot;Interactive level-8 parabolic Anderson model on the Sierpinski gasket with a continuous localized initial profile of unit mass.&quot;, &quot;model_caption&quot;: &quot;One realization of the Itô parabolic Anderson model with Neumann boundary conditions and space–time white noise. The initial condition is a nonnegative continuous harmonic hat of total mass one, supported on two adjacent level-2 cells (measure 2/9) and zero elsewhere.&quot;, &quot;reading_caption&quot;: &quot;Positivity: every saved positive-time snapshot is positive at all 9,843 graph vertices, including points outside the initial support. The ln u view reveals very small positive values; switch to u to inspect spatial peaks. This is a numerical illustration of strict positivity, not a proof for the continuum SPDE.&quot;, &quot;method_heading&quot;: &quot;Numerical method and interpretation&quot;, &quot;numerical_accuracy_note&quot;: &quot;Time-step sensitivity: comparing Δt with 2Δt gives a 30.8% relative weighted L² difference at the final time, or 4.1% after normalizing each profile by its total mass. The normalized difference reaches 15.8% over saved times. This path is a qualitative illustration; absolute amplitudes and individual peak locations remain sensitive to time resolution.&quot;, &quot;method_note&quot;: &quot;At time zero, 2,185 vertices are positive and 7,658 are exactly zero. The level-2 nodal hat equals 1 at x₀ and 0 at the other level-2 vertices, is harmonically extended within cells, and is multiplied by 27/2 for unit mass. Exact zeros have ln u = −∞ and are not assigned a finite logarithmic height or color. Positive values have no display floor. Both choices use the same driving noise, with only the initial condition changed. Peak / mean is max(u) / ∫u dμ; spatial concentration in these paths does not establish ensemble moment intermittency. The noise is white relative to dt μ(dx), with μ the normalized Hausdorff measure. The scheme preserves positivity in exact arithmetic; very small early tails are not quantitatively certified, and floating-point zeros should not be read as a propagation delay.&quot;, &quot;equation_mathml&quot;: &quot;\u003cmath display=\&quot;block\&quot;&gt;\u003cmrow&gt;\u003cmsub&gt;\u003cmi&gt;∂\u003c/mi&gt;\u003cmi&gt;t\u003c/mi&gt;\u003c/msub&gt;\u003cmi&gt;u\u003c/mi&gt;\u003cmo&gt;=\u003c/mo&gt;\u003cmi&gt;κ\u003c/mi&gt;\u003cmsub&gt;\u003cmi&gt;Δ\u003c/mi&gt;\u003cmtext&gt;SG,N\u003c/mtext&gt;\u003c/msub&gt;\u003cmi&gt;u\u003c/mi&gt;\u003cmo&gt;+\u003c/mo&gt;\u003cmi&gt;λ\u003c/mi&gt;\u003cmi&gt;u\u003c/mi&gt;\u003cmover&gt;\u003cmi&gt;W\u003c/mi&gt;\u003cmo&gt;˙\u003c/mo&gt;\u003c/mover&gt;\u003c/mrow&gt;\u003c/math&gt;&quot;, &quot;equation_accessible_text&quot;: &quot;The time derivative of u equals kappa times the Neumann gasket Laplacian of u plus lambda times u times space-time white noise.&quot;}&lt;/script&gt;

function sgGeometry(level) {
  const scale=2**level;
  let cells=[[[0,0],[scale,0],[0,scale]]];
  for(let k=0;k&lt;level;k++){
    const next=[];
    for(const [a,b,c] of cells){
      const ab=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const ac=[(a[0]+c[0])/2,(a[1]+c[1])/2];
      const bc=[(b[0]+c[0])/2,(b[1]+c[1])/2];
      next.push([a,ab,ac],[ab,b,bc],[ac,bc,c]);
    }
    cells=next;
  }
  const indices=new Map(),coords=[],triangles=[];
  for(const cell of cells){
    const tri=[];
    for(const [x,y] of cell){
      const key=x+&#x27;,&#x27;+y;
      if(!indices.has(key)){
        indices.set(key,coords.length);
        coords.push([(x+.5*y)/scale,Math.sqrt(3)*.5*y/scale]);
      }
      tri.push(indices.get(key));
    }
    triangles.push(tri);
  }
  return {coords,triangles};
}

        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
