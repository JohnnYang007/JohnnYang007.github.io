<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Explore the parabolic Anderson model on the Sierpiński gasket from a point mass or a localized continuous initial profile.">
  <title>Parabolic Anderson model on the Sierpiński gasket</title>
  <style>
    :root{color-scheme:light dark;--page:#fff;--ink:#242424;--muted:#626262;--line:#d7d7d7;--accent:#2458ad}
    @media(prefers-color-scheme:dark){:root{--page:#181818;--ink:#ececec;--muted:#aaa;--line:#555;--accent:#a7c7ff}}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--page);color:var(--ink)}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
    .initial-controls{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px 24px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
    .initial-field{display:flex;flex-direction:column;gap:6px;max-width:100%}
    .initial-field label{font-size:.875rem;font-weight:600}
    select{font:inherit;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:6px;padding:8px 34px 8px 10px;max-width:100%;min-height:42px}
    select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .direct-link{color:var(--accent);font-size:.875rem;line-height:1.4;text-underline-offset:3px;padding:9px 0}
    #initial-status{margin:0;padding:8px 16px 0;color:var(--muted);font-size:.875rem}
    #initial-status:empty{display:none}
    #pam-selected-view{display:block;width:100%;height:1040px;border:0;background:var(--page)}
    noscript p{margin:16px}
    @media(max-width:440px){.initial-controls{gap:8px;padding:12px 16px}.initial-field{width:100%}.initial-field select{width:100%}.direct-link{padding:3px 0}}
  </style>
</head>
<body>
  <div class="initial-controls">
    <div class="initial-field">
      <label for="pam-initial">Initial condition</label>
      <select id="pam-initial" aria-controls="pam-selected-view">
        <option value="delta" selected>Delta point mass</option>
        <option value="hat">Localized continuous profile</option>
      </select>
    </div>
    <a id="pam-direct-link" class="direct-link" href="./pam-delta.html" target="_blank" rel="noopener noreferrer">Open selected view in a separate page</a>
  </div>
  <p id="initial-status" role="status" aria-live="polite"></p>
  <iframe id="pam-selected-view" title="Parabolic Anderson model: Delta point mass"></iframe>
  <noscript><p>JavaScript is needed for the interactive selector. Open the <a href="./pam-delta.html">point-mass view</a> or the <a href="./pam-hat.html">localized-profile view</a> directly.</p></noscript>
  <script>
  (() => {
    'use strict';
    const views=Object.freeze({
      delta:{file:'pam-delta.html',label:'Delta point mass'},
      hat:{file:'pam-hat.html',label:'Localized continuous profile'}
    });
    const select=document.getElementById('pam-initial');
    const frame=document.getElementById('pam-selected-view');
    const direct=document.getElementById('pam-direct-link');
    const status=document.getElementById('initial-status');
    let selected=null,expectedURL=null,observer=null,childBody=null,resizeRequest=0;

    function validKey(value){return Object.prototype.hasOwnProperty.call(views,value)?value:'delta';}
    function disconnect(){
      if(observer)observer.disconnect();
      observer=null;childBody=null;
      if(resizeRequest)cancelAnimationFrame(resizeRequest);
      resizeRequest=0;
    }
    function resize(){
      resizeRequest=0;
      if(!childBody||!childBody.isConnected)return;
      // Read the content body, not the viewport-sized documentElement. The
      // standalone child resizes its own inner iframe when content changes.
      const height=Math.ceil(Math.max(childBody.scrollHeight,childBody.getBoundingClientRect().height));
      if(Number.isFinite(height)&&height>0&&Math.abs(frame.clientHeight-height)>2){
        frame.style.height=height+'px';
      }
    }
    function queueResize(){if(!resizeRequest)resizeRequest=requestAnimationFrame(resize);}
    function show(value,writeURL){
      const key=validKey(value),view=views[key];
      select.value=key;
      if(writeURL){
        const page=new URL(location.href);
        page.searchParams.set('initial',key);
        try{history.replaceState(null,'',page.href);}catch(_error){/* Selection still works if history access is restricted. */}
      }
      const target=new URL(view.file,location.href);
      direct.href=target.href;
      frame.title='Parabolic Anderson model: '+view.label;
      if(key===selected)return;
      selected=key;expectedURL=target.href;
      disconnect();
      frame.setAttribute('aria-busy','true');
      status.textContent='Loading '+view.label.toLowerCase()+'…';
      frame.src=target.href;
    }
    frame.addEventListener('load',()=>{
      // Ignore an initial about:blank or a superseded navigation. The target
      // always comes from the two-file allowlist above, never from a URL input.
      try{
        const doc=frame.contentDocument;
        if(!doc||doc.URL!==expectedURL)return;
        disconnect();
        childBody=doc.body;
        if(!childBody)throw new Error('Missing viewer body');
        observer=new ResizeObserver(queueResize);
        observer.observe(childBody);
        queueResize();
        frame.setAttribute('aria-busy','false');
        status.textContent='';
      }catch(_error){
        frame.setAttribute('aria-busy','false');
        status.textContent='If the embedded view is unavailable, use the separate-page link above.';
      }
    });
    frame.addEventListener('error',()=>{
      frame.setAttribute('aria-busy','false');
      status.textContent='The embedded view could not load. Use the separate-page link above.';
    });
    select.addEventListener('change',()=>show(select.value,true));
    window.addEventListener('popstate',()=>show(new URL(location.href).searchParams.get('initial'),false));
    window.addEventListener('resize',queueResize);
    window.addEventListener('pagehide',event=>{if(!event.persisted)disconnect();});
    show(new URL(location.href).searchParams.get('initial'),true);
  })();
  </script>
</body>
</html>
