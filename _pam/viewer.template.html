<div id="sg-pam-view">
  <h2 id="sg-title">Parabolic Anderson model on the Sierpiński gasket</h2>
  <div class="sg-equation" id="sg-equation" aria-label="The time derivative of u equals kappa times the Neumann gasket Laplacian of u plus lambda times u times space-time white noise.">
    <math display="block"><mrow><msub><mi>∂</mi><mi>t</mi></msub><mi>u</mi><mo>=</mo><mi>κ</mi><msub><mi>Δ</mi><mtext>SG,N</mtext></msub><mi>u</mi><mo>+</mo><mi>λ</mi><mi>u</mi><mover><mi>W</mi><mo>˙</mo></mover></mrow></math>
  </div>
  <div class="viz-row text-small text-muted" id="sg-meta"></div>
  <div class="viz-controls sg-toolbar">
    <button type="button" class="btn btn-primary" id="sg-play">Play</button>
    <button type="button" class="btn" id="sg-linear" aria-pressed="false">u</button>
    <button type="button" class="btn" id="sg-log" aria-pressed="true">ln u</button>
    <span class="text-small" id="sg-scale-label">Height and color rescaled at each time</span>
  </div>
  <div class="sg-time-heading"><label for="sg-time" id="sg-time-heading-label">Time</label><output id="sg-time-label" class="tabular-nums"></output></div>
  <input type="range" class="form-range" id="sg-time" min="0" max="80" step="1" value="0" aria-label="Solution snapshot time">
  <div class="sg-panels">
    <section>
      <div class="sg-panel-heading"><h3>Solution height</h3><span class="text-small text-muted">Drag to rotate</span></div>
      <canvas id="sg-surface" role="img" aria-label="Three-dimensional solution height; gasket holes remain open"></canvas>
      <div class="sg-angle"><label for="sg-angle" class="text-small">View angle</label><input type="range" class="form-range" id="sg-angle" min="-180" max="180" step="1" value="-30" aria-label="Horizontal rotation of the three-dimensional view"></div>
    </section>
    <section>
      <div class="sg-panel-heading"><h3>Plan view</h3><span class="text-small text-muted">Select a point</span></div>
      <canvas id="sg-map" role="img" aria-label="Heatmap of the same solution; gasket holes remain open"></canvas>
      <div class="sg-legend"><span id="sg-legend-title" class="text-small">u</span><canvas id="sg-colorbar" role="img" aria-label="Solution color scale"></canvas></div>
    </section>
  </div>
  <div class="viz-row text-small tabular-nums sg-stats"><span id="sg-min"></span><span id="sg-max"></span><span id="sg-mass"></span><span id="sg-ratio"></span><span id="sg-positive"></span></div>
  <div class="text-small" id="sg-zero-note" hidden></div>
  <div class="text-small sg-detail" id="sg-detail" aria-live="polite">No vertex selected</div>
  <p class="text-small sg-caption" id="sg-caption-model"></p>
  <p class="text-small sg-caption" id="sg-caption-reading"></p>
  <details class="sg-method text-small"><summary id="sg-method-heading">Numerical method and interpretation</summary><p id="sg-method-copy"></p><p id="sg-accuracy-note"></p><p id="sg-method-note"></p><p>Related theory: <a href="https://arxiv.org/abs/1709.00916" target="_blank" rel="noopener noreferrer">Hambly and Yang, parabolic SPDEs on p.c.f. fractals</a>.</p></details>
  <div class="sr-only" id="sg-announcement" aria-live="polite"></div>
  <script type="application/json" id="sg-trajectory">__SG_TRAJECTORY__</script>
  <script type="application/json" id="sg-copy">__SG_COPY__</script>
</div>
<style>
  #sg-pam-view { color:var(--foreground); width:100%; }
  #sg-pam-view h2 { margin:0 0 8px; }
  #sg-pam-view h3 { margin:0; }
  #sg-pam-view .sg-equation { margin:14px 0; }
  #sg-pam-view .sg-equation math { color:var(--foreground); }
  #sg-pam-view .sg-caption { margin:12px 0 0; }
  #sg-pam-view .sg-method { margin-top:14px; }
  #sg-pam-view .sg-method summary { color:var(--foreground); }
  #sg-pam-view .sg-toolbar { margin:16px 0 12px; }
  #sg-pam-view .sg-time-heading, #sg-pam-view .sg-panel-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  #sg-pam-view .sg-panels { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; margin-top:10px; }
  #sg-pam-view .sg-panels section { min-width:0; }
  #sg-pam-view .sg-panel-heading { min-height:36px; }
  #sg-pam-view #sg-surface, #sg-pam-view #sg-map { width:100%; height:340px; display:block; }
  #sg-pam-view #sg-surface { cursor:grab; touch-action:none; }
  #sg-pam-view #sg-surface:active { cursor:grabbing; }
  #sg-pam-view #sg-map { cursor:crosshair; }
  #sg-pam-view .sg-angle { display:flex; align-items:center; gap:16px; min-height:42px; }
  #sg-pam-view .sg-angle input { flex:1; }
  #sg-pam-view .sg-legend { display:flex; align-items:flex-start; gap:14px; min-height:42px; }
  #sg-pam-view #sg-colorbar { width:100%; height:42px; min-width:0; }
  #sg-pam-view #sg-legend-title { white-space:nowrap; }
  #sg-pam-view .sg-stats { gap:24px; margin:10px 0 8px; }
  #sg-pam-view .sg-detail { min-height:24px; }
  @media (max-width:620px) {
    #sg-pam-view .sg-panels { grid-template-columns:minmax(0,1fr); gap:8px; }
    #sg-pam-view #sg-surface, #sg-pam-view #sg-map { height:300px; }
    #sg-pam-view .sg-stats { gap:12px; }
  }
</style>
<script>
__SG_DECODER__
(async () => {
  'use strict';
  const root = document.getElementById('sg-pam-view');
  const byId = id => root.querySelector('#'+id);
  const C=JSON.parse(byId('sg-copy').textContent);
  const D = await decodeSgTrajectory(JSON.parse(byId('sg-trajectory').textContent));
  const p=D.params;
  const isDelta=p.initial_type==='delta';
  const sourceIndex=Number.isInteger(p.source_index)?p.source_index:null;
  const simulationId=`sg-pam-initial-choice-${p.initial_type||'constant'}-${p.seed}-m${p.level}-k${p.kappa}-l${p.lambda}`;
  const surface = byId('sg-surface'), map = byId('sg-map'), bar = byId('sg-colorbar');
  const timeline=byId('sg-time'), play=byId('sg-play'), angle=byId('sg-angle');
  const linearButton=byId('sg-linear'), logButton=byId('sg-log');
  const N = D.coords.length, last = D.frames.length-1;
  let lowLog=0,highLog=1,maxLinear=1,positiveCount=0;
  const initialFrame=D.times.reduce((best,t,i)=>Math.abs(t-p.T/2)<Math.abs(D.times[best]-p.T/2)?i:best,0);
  const initiallyZeroIndex=D.frames[0].findIndex(value=>value===0);
  const state={frame:initialFrame,log:true,yaw:-30*Math.PI/180,tilt:1.0,selected:initiallyZeroIndex>=0?initiallyZeroIndex:sourceIndex,playing:false};
  let timer=null, projected=[], mapPositions=[], palette=[], colors={}, renderQueued=false;
  const fmt = x => Math.abs(x)>=100 ? x.toFixed(1) : Math.abs(x)>=.01 ? x.toFixed(3) : x.toExponential(2);
  timeline.max=String(last);
  byId('sg-title').textContent=C.title;
  byId('sg-caption-model').textContent=C.model_caption;
  byId('sg-caption-reading').textContent=C.reading_caption;
  byId('sg-method-heading').textContent=C.method_heading;
  byId('sg-method-note').textContent=C.method_note;
  byId('sg-accuracy-note').textContent=C.numerical_accuracy_note||'';
  if(C.equation_mathml)byId('sg-equation').innerHTML=C.equation_mathml;
  if(C.equation_accessible_text)byId('sg-equation').setAttribute('aria-label',C.equation_accessible_text);
  byId('sg-meta').textContent=`Neumann · ${p.initial_label||(isDelta?'unit point-mass initial data':'u₀ = 1')} · level ${p.level} · ${N.toLocaleString()} vertices · κ = ${p.kappa} · λ = ${p.lambda} · seed ${p.seed}`;
  byId('sg-method-copy').textContent=`Level-${p.level} mass-lumped graph approximation with ${N.toLocaleString()} vertices and ${D.triangles.length.toLocaleString()} retained cells. Each step applies the exact scalar Itô noise flow, followed by implicit diffusion. Time step: ${p.dt.toExponential(1)}. Displayed snapshots: ${D.frames.length} of ${D.display_encoding.original_saved_frame_count}. Zero locations and source values are preserved exactly; reported extrema and total mass use the original data. Other displayed vertex values have less than ${(100*D.display_encoding.relative_error_bound).toFixed(2)}% relative encoding error.`;
  if(p.frame_schedule==='quadratic')byId('sg-time-heading-label').textContent='Time · early evolution slowed down';

  function restore(saved) {
    const q=saved?.modelContent, v=saved?.privateContent;
    if(q?.simulation===simulationId && q.seed===p.seed) {
      if(Number.isFinite(q.frame)) state.frame=Math.max(0,Math.min(last,Math.round(q.frame)));
      state.log=q.scale==='ln';
      if(Number.isInteger(q.vertex)&&q.vertex>=0&&q.vertex<N) state.selected=q.vertex;
      else state.selected=null;
    }
    if(q?.simulation===simulationId){
      if(Number.isFinite(v?.yaw)) state.yaw=v.yaw;
      if(Number.isFinite(v?.tilt)) state.tilt=Math.max(.3,Math.min(1.35,v.tilt));
    }
  }
  restore(window.openai?.widgetState);
  function save() {
    const selected=state.selected;
    window.openai?.setWidgetState?.({modelContent:{simulation:simulationId,initialCondition:p.initial_condition,frame:state.frame,time:D.times[state.frame],scale:state.log?'ln':'linear',scaleAcrossTime:'per-frame',displayFloor:null,positiveVertices:positiveCount,totalVertices:N,vertex:selected,solutionAtVertex:selected===null?null:D.frames[state.frame][selected],solutionAtVertexApproximate:selected!==null&&selected!==sourceIndex,peakToMean:D.maxima[state.frame]/D.masses[state.frame],seed:p.seed},privateContent:{yaw:state.yaw,tilt:state.tilt}})?.catch(()=>{});
  }
  window.addEventListener('openai:set_globals',e=>{
    const saved=e.detail?.globals?.widgetState;
    if(saved){stop();restore(saved);draw();}
  });
  const probe=document.createElement('span');
  probe.setAttribute('aria-hidden','true');
  probe.style.position='absolute';probe.style.visibility='hidden';root.appendChild(probe);
  const pixel=document.createElement('canvas');pixel.width=pixel.height=1;
  const pc=pixel.getContext('2d',{willReadFrequently:true});
  function resolve(name) {probe.style.color=`var(${name})`;return getComputedStyle(probe).color;}
  function rgb(css) {pc.clearRect(0,0,1,1);pc.fillStyle=css;pc.fillRect(0,0,1,1);return Array.from(pc.getImageData(0,0,1,1).data).slice(0,3);}
  function theme() {
    colors={fg:resolve('--foreground'),muted:resolve('--muted-foreground'),border:resolve('--border'),bg:resolve('--background'),series:resolve('--viz-series-1')};
    const a=rgb(colors.bg),b=rgb(colors.series),c=rgb(colors.fg);
    palette=Array.from({length:256},(_,i)=>{
      const t=i/255,alpha=.18+.82*Math.pow(t,.65);
      let vals=a.map((x,k)=>x*(1-alpha)+b[k]*alpha);
      if(t>.8){const q=(t-.8)*1.8;vals=vals.map((x,k)=>x*(1-q)+c[k]*q);}
      return `rgb(${vals.map(Math.round).join(',')})`;
    });
  }
  function setup(canvas) {
    const r=canvas.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    const w=Math.max(1,r.width),h=Math.max(1,r.height);
    if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
    const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
    ctx.font=getComputedStyle(root).font;ctx.textBaseline='middle';
    return {ctx,w,h};
  }
  function norm(u) {return state.log?(u>0?(Math.log(u)-lowLog)/(highLog-lowLog):null):u/maxLinear;}
  const color=t=>palette[Math.round(Math.min(1,Math.max(0,t))*255)];
  function text(ctx,t,x,y,align='center') {ctx.fillStyle=colors.fg;ctx.textAlign=align;ctx.fillText(t,x,y);}
  function line(ctx,points,stroke=colors.border,width=1) {ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.beginPath();points.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke();}
  function polygon(ctx,points,fill) {ctx.fillStyle=fill;ctx.beginPath();points.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.fill();}
  function drawMap(u) {
    const {ctx,w,h}=setup(map);
    const size=Math.min(w-48,(h-40)/(.8660254)),ox=(w-size)/2,oy=h-24;
    mapPositions=D.coords.map(([x,y])=>({x:ox+x*size,y:oy-y*size}));
    D.triangles.forEach(t=>{
      if(state.log&&t.some(i=>u[i]===0)){line(ctx,[...t,t[0]].map(i=>mapPositions[i]));return;}
      polygon(ctx,t.map(i=>mapPositions[i]),color(t.reduce((s,i)=>s+norm(u[i]),0)/3));
    });
    // Isolated positive vertices remain visible when adjacent log faces are undefined.
    if(state.log&&positiveCount<N)u.forEach((v,i)=>{if(v<=0)return;const q=mapPositions[i];ctx.beginPath();ctx.arc(q.x,q.y,2,0,2*Math.PI);ctx.fillStyle=color(norm(v));ctx.fill();});
    if(sourceIndex!==null){const q=mapPositions[sourceIndex];ctx.beginPath();ctx.arc(q.x,q.y,3.5,0,2*Math.PI);ctx.fillStyle=u[sourceIndex]>0?color(norm(u[sourceIndex])):colors.muted;ctx.fill();ctx.strokeStyle=colors.fg;ctx.lineWidth=1;ctx.stroke();text(ctx,'x₀',q.x-10,q.y-11,'right');}
    if(state.selected!==null){const q=mapPositions[state.selected];ctx.beginPath();ctx.arc(q.x,q.y,5,0,2*Math.PI);ctx.strokeStyle=colors.fg;ctx.lineWidth=1.5;ctx.stroke();}
    map.setAttribute('aria-label',`Time ${D.times[state.frame].toFixed(4)} solution heatmap; minimum ${fmt(D.minima[state.frame])}; maximum ${fmt(D.maxima[state.frame])}`);
  }
  function drawSurface(u) {
    const {ctx,w,h}=setup(surface);
    const ca=Math.cos(state.yaw),sa=Math.sin(state.yaw),ce=Math.cos(state.tilt),se=Math.sin(state.tilt);
    const raw=(x,y,z)=>{x-=.5;y-=.288675;const X=x*ca-y*sa,Y=x*sa+y*ca;return {x:X,y:-(Y*se+z*ce),depth:-Y*ce+z*se};};
    const hull=[];
    const relief=.60;
    [[0,0],[1,0],[.5,.8660254]].forEach(([x,y])=>{hull.push(raw(x,y,0));hull.push(raw(x,y,relief));});
    const xmin=Math.min(...hull.map(q=>q.x)),xmax=Math.max(...hull.map(q=>q.x)),ymin=Math.min(...hull.map(q=>q.y)),ymax=Math.max(...hull.map(q=>q.y));
    const scale=Math.min((w-128)/(xmax-xmin),(h-48)/(ymax-ymin));
    const project=(x,y,z)=>{const q=raw(x,y,z);return {x:w/2+22+(q.x-(xmin+xmax)/2)*scale,y:h/2+(q.y-(ymin+ymax)/2)*scale,depth:q.depth};};
    const ground=D.coords.map(([x,y])=>project(x,y,0));
    ctx.globalAlpha=.35;
    D.triangles.forEach(t=>line(ctx,[...t,t[0]].map(i=>ground[i])));
    ctx.globalAlpha=1;
    projected=D.coords.map(([x,y],i)=>state.log&&u[i]===0?null:project(x,y,relief*norm(u[i])));
    const faces=D.triangles.filter(t=>t.every(i=>projected[i]!==null)).map(t=>({t,depth:t.reduce((s,i)=>s+projected[i].depth,0)/3})).sort((a,b)=>a.depth-b.depth);
    faces.forEach(({t})=>{
      const qs=t.map(i=>projected[i]);polygon(ctx,qs,color(t.reduce((s,i)=>s+norm(u[i]),0)/3));
      ctx.globalAlpha=p.level>=8?.07:.18;line(ctx,[...qs,qs[0]],colors.fg,.5);ctx.globalAlpha=1;
    });
    const axisX=Math.min(...ground.map(q=>q.x))-18;
    const base={x:axisX,y:Math.max(...ground.map(q=>q.y))},top={x:axisX,y:base.y-relief*ce*scale};
    line(ctx,[base,top],colors.muted,1);
    const levels=[0,.5,1];
    levels.forEach(t=>{const q={x:axisX,y:base.y-t*relief*ce*scale};line(ctx,[{x:q.x-3,y:q.y},{x:q.x+3,y:q.y}],colors.muted);const value=state.log?lowLog+t*(highLog-lowLog):t*maxLinear;const label=state.log?value.toFixed(1):fmt(value);text(ctx,label,q.x-7,q.y,'right');});
    text(ctx,state.log?'ln u':'u',top.x,top.y-17);
    if(state.log&&positiveCount<N)projected.forEach((q,i)=>{if(!q)return;ctx.beginPath();ctx.arc(q.x,q.y,2,0,2*Math.PI);ctx.fillStyle=color(norm(u[i]));ctx.fill();});
    if(state.selected!==null&&projected[state.selected]){const q=projected[state.selected];ctx.beginPath();ctx.arc(q.x,q.y,4,0,Math.PI*2);ctx.strokeStyle=colors.fg;ctx.lineWidth=1.5;ctx.stroke();}
    surface.setAttribute('aria-label',`${state.log?'Natural logarithm of solution':'Solution'} height at time ${D.times[state.frame].toFixed(5)}; ${positiveCount} of ${N} vertices are positive; zero values have no finite logarithmic height.`);
  }
  function drawBar() {
    const {ctx,w,h}=setup(bar),start=20,end=w-20;
    for(let i=0;i<256;i++){ctx.fillStyle=palette[i];ctx.fillRect(start+i/256*(end-start),2,(end-start)/256+1,9);}
    [0,.5,1].forEach(t=>{const x=start+t*(end-start),v=state.log?lowLog+t*(highLog-lowLog):t*maxLinear;const label=state.log?v.toFixed(1):fmt(v);text(ctx,label,x,27,t===0?'left':t===1?'right':'center');});
  }
  function detail() {
    if(state.selected===null){byId('sg-detail').textContent='Select a vertex in the plan view to follow its solution value.';return;}
    const i=state.selected,[x,y]=D.coords[i],u=D.frames[state.frame][i];
    const label=i===sourceIndex?(isDelta?'Initial point mass x₀':'Hat center x₀'):D.frames[0][i]===0?'Initially zero vertex '+i:'Vertex '+i;
    byId('sg-detail').textContent=`${label} · x = (${x.toFixed(3)}, ${y.toFixed(3)}) · u ${i===sourceIndex?'=':'≈'} ${fmt(u)} · ln u ${u>0?(i===sourceIndex?'=':'≈')+' '+Math.log(u).toFixed(3):'= −∞'}`;
  }
  function draw() {
    renderQueued=false;
    const u=D.frames[state.frame];
    maxLinear=D.maxima[state.frame];
    positiveCount=0;
    let minPositive=Infinity;
    for(const v of u){if(v>0){positiveCount++;minPositive=Math.min(minPositive,v);}}
    highLog=Math.log(maxLinear);
    lowLog=Math.log(minPositive);
    if(highLog-lowLog<1e-8)lowLog=highLog-1;
    timeline.value=String(state.frame);angle.value=String(Math.round(state.yaw*180/Math.PI));
    linearButton.setAttribute('aria-pressed',String(!state.log));logButton.setAttribute('aria-pressed',String(state.log));
    byId('sg-time-label').textContent=`t = ${D.times[state.frame].toFixed(5)} / ${D.times[last].toFixed(2)}`;
    byId('sg-scale-label').textContent=state.log?'Full positive range · natural log · scales adjust with time':'Height and color rescaled at each time';
    byId('sg-legend-title').textContent=state.log?'ln u':'u';
    byId('sg-min').textContent=`min u = ${fmt(D.minima[state.frame])}`;
    byId('sg-max').textContent=`max u = ${fmt(D.maxima[state.frame])}`;
    byId('sg-mass').textContent=`∫ u dμ = ${fmt(D.masses[state.frame])}`;
    byId('sg-ratio').textContent=`Peak / mean = ${fmt(D.maxima[state.frame]/D.masses[state.frame])}`;
    byId('sg-positive').textContent=`Positive vertices: ${positiveCount.toLocaleString()} / ${N.toLocaleString()}`;
    byId('sg-zero-note').hidden=!(state.log&&positiveCount<N);
    byId('sg-zero-note').textContent=`u = 0 at ${(N-positiveCount).toLocaleString()} vertices: ln u = −∞ (no finite height or color).`;
    drawSurface(u);drawMap(u);drawBar();
    detail();
    root.dataset.frame=String(state.frame);root.dataset.scale=state.log?'ln':'linear';
    root.dataset.logMin=String(lowLog);root.dataset.logMax=String(highLog);root.dataset.positiveCount=String(positiveCount);
    root.dataset.ready='true';
  }
  function schedule(){if(!renderQueued){renderQueued=true;requestAnimationFrame(draw);}}
  function stop(){state.playing=false;if(timer!==null)clearTimeout(timer);timer=null;play.textContent='Play';byId('sg-detail').setAttribute('aria-live','polite');}
  function tick(){if(!state.playing)return;if(state.frame>=last){stop();detail();save();return;}state.frame++;draw();timer=setTimeout(tick,125);}
  play.addEventListener('click',()=>{
    if(state.playing){stop();detail();save();return;}
    if(state.frame>=last)state.frame=0;
    state.playing=true;play.textContent='Pause';byId('sg-detail').setAttribute('aria-live','off');timer=setTimeout(tick,125);
  });
  timeline.addEventListener('input',()=>{stop();state.frame=Number(timeline.value);draw();});
  timeline.addEventListener('change',()=>{save();byId('sg-announcement').textContent=`Time ${D.times[state.frame].toFixed(4)}`;});
  function mode(log){state.log=log;draw();save();}
  linearButton.addEventListener('click',()=>mode(false));logButton.addEventListener('click',()=>mode(true));
  angle.addEventListener('input',()=>{state.yaw=Number(angle.value)*Math.PI/180;schedule();});
  angle.addEventListener('change',save);
  let drag=null;
  surface.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw:state.yaw,tilt:state.tilt};surface.setPointerCapture(e.pointerId);});
  surface.addEventListener('pointermove',e=>{if(!drag)return;state.yaw=drag.yaw+(e.clientX-drag.x)*.012;state.yaw=((state.yaw+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;state.tilt=Math.min(1.35,Math.max(.3,drag.tilt+(e.clientY-drag.y)*.006));schedule();});
  surface.addEventListener('pointerup',()=>{drag=null;save();});
  surface.addEventListener('pointercancel',()=>{drag=null;});
  map.addEventListener('click',e=>{
    const r=map.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    let closest=0,dist=Infinity;mapPositions.forEach((q,i)=>{const d=(q.x-x)**2+(q.y-y)**2;if(d<dist){dist=d;closest=i;}});
    if(dist>144)return;state.selected=closest;draw();save();
  });
  new ResizeObserver(schedule).observe(root);
  const appearance=new MutationObserver(()=>{theme();schedule();});appearance.observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{theme();schedule();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();save();}});
  theme();draw();
})().catch(error=>{
  const message=document.createElement('div');
  message.setAttribute('role','alert');
  message.className='text-destructive';
  message.textContent='Unable to load solution data: '+error.message;
  document.getElementById('sg-pam-view').appendChild(message);
});
</script>
